name: release

# 打 v* tag 时构建各平台二进制，挂到同名 release 上。
# 手动触发的运行只构建并留 artifact，不建 release（没有 tag 可用）。

# tag 要是合法 semver 且主版本是 0 或 1：模块路径没有 /v2，
# 更高的主版本（如 v9.9.9）会被 Go 忽略，--version 退化成伪版本。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  build:
    name: build ${{ matrix.asset }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            asset: kiln_windows_amd64.exe
          - goos: darwin
            goarch: arm64
            asset: kiln_darwin_arm64
          - goos: darwin
            goarch: amd64
            asset: kiln_darwin_amd64
          - goos: linux
            goarch: amd64
            asset: kiln_linux_amd64
          - goos: linux
            goarch: arm64
            asset: kiln_linux_arm64
    steps:
      - uses: actions/checkout@v4
        with:
          # 浅克隆拿不到 tag，go build 的版本信息会退化成伪版本；
          # fetch-depth: 0 让 --version 显示真正的 tag。
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          # 二进制写到仓库外：落在工作区里的未跟踪文件会让
          # Go 的 VCS 版本戳带上 +dirty。
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          go build -trimpath -ldflags="-s -w" -o "$out/${{ matrix.asset }}" ./cmd/kiln
          file "$out/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/out/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum kiln_* > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: kiln ${{ github.ref_name }}
          files: |
            dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
